# Example: run Phi-nance beside sibling clones (adjust paths / branches).
# Copy to docker-compose.yml locally; not used by CI.
#
# Prereqs: ../Phi-nance, ../lumibot, ../tensortrade, ../agent-cli on same host.

services:
  phinance-workbench:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - DATA_CACHE_DIR=/data/cache
    volumes:
      - phinance_data:/data
    # If no Dockerfile at repo root, replace `build` with `image` + bind-mount.

