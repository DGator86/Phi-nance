    enabled: true
    rate_limit: 200
    rate_window_seconds: 60
  yfinance:
    enabled: true
    rate_limit: 10
    rate_window_seconds: 1
  thetadata:
    enabled: true
    rate_limit: 5
    rate_window_seconds: 1
    daily_limit: 10000
  fmp:
    enabled: true
    rate_limit: 250
    rate_window_seconds: 86400
