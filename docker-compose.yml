# Phi-nance — headless stack for local research + QuantConnect bundle export.
#
#   cp .env.example .env
#   docker compose up --build -d
#
# Environment:
#   PHINANCE_LOG_LEVEL, PHINANCE_LOG_JSON, DATA_CACHE_ROOT, PHINANCE_QC_EXPORT_DIR

version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: phinance-qc:latest
    container_name: phinance-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PHINANCE_LOG_LEVEL=${PHINANCE_LOG_LEVEL:-INFO}
      - PHINANCE_LOG_JSON=${PHINANCE_LOG_JSON:-0}
      - DATA_CACHE_ROOT=${DATA_CACHE_ROOT:-/app/data_cache}
      - PHINANCE_QC_EXPORT_DIR=/exports
    volumes:
      - data_cache:/app/data_cache
      - qc_exports:/exports
    ports:
      - "8080:8080"
    networks:
      - phinance-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Optional: long-running worker for batch jobs (override command as needed)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime-worker
    image: phinance-worker:latest
    container_name: phinance-worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file: .env
    environment:
      - PHINANCE_LOG_LEVEL=${PHINANCE_LOG_LEVEL:-INFO}
      - DATA_CACHE_ROOT=${DATA_CACHE_ROOT:-/app/data_cache}
    volumes:
      - data_cache:/app/data_cache
      - model_store:/app/models
      - run_store:/app/runs
    networks:
      - phinance-net
    command: ["sleep", "infinity"]

volumes:
  data_cache:
    driver: local
  qc_exports:
    driver: local
  model_store:
    driver: local
  run_store:
    driver: local

networks:
  phinance-net:
    driver: bridge
